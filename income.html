<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 가계부 - 수입 내역</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ai-analysis.css">
</head>
<body>

<main>
  <section class="hero income-hero">
    <div class="hero-bg"></div>

    <header class="nav">
      <div class="nav-inner">
        <div class="nav-left">
          <div class="logo">
            <span class="logo-icon">📘</span>
            <span class="logo-text">My 가계부</span>
          </div>

          <nav class="nav-menu">
            <a href="index.html" target="_blank" class="nav-link">홈</a>
            <a href="income.html" target="_blank" class="nav-link active">수입</a>
            <a href="expense.html" target="_blank" class="nav-link">지출</a>
          </nav>
        </div>

        <div class="nav-right">
          <nav class="nav-menu">
            <a href="savings.html" target="_blank" class="nav-link">적금</a>
            <a href="stats.html" target="_blank" class="nav-link">통계</a>
            <a href="settings.html" target="_blank" class="nav-link">설정</a>
          </nav>

          <div class="user-menu" id="user-menu">
            <span class="user-icon">👤</span>
            <span class="user-greeting">사랑해요 양균님</span>
            <span class="dropdown-arrow">⌄</span>

            <div class="user-dropdown" id="user-dropdown">
              <button type="button" class="user-dropdown-item logout" id="logout-btn">
                <span class="user-dropdown-icon">🚪</span>
                <span>로그아웃</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="hero-content">
      <p class="hero-line1">이번 달 수입을 확인해볼까요?</p>
      <h1 class="hero-line2">수입 내역</h1>
      <p class="hero-line3">구글 시트에 입력한 수입이 여기 모여서 보여요. 항목을 눌러 따로 볼 수도 있어요.</p>
    </div>
  </section>

  <section class="tables single">
    <div class="table-card">
      <div class="table-header">
        <h2><span class="table-icon income">↓</span> 수입 내역</h2>
        <label class="period-control-field" style="margin:0;">
          <select id="income-period-select" style="font-family:var(--font-body); font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; color:var(--text-main);">
            <option value="all">전체 기간</option>
            <option value="current" selected>이번 달</option>
            <option value="prev">지난달</option>
          </select>
        </label>
      </div>

      <div class="category-tabs" id="income-category-tabs">
        <button type="button" class="category-tab active" data-category="all">전체</button>
      </div>

      <div class="table-actions">
        <span class="selected-count" id="income-filtered-total">0원</span>
      </div>

      <table>
        <thead>
          <tr><th>날짜</th><th>항목</th><th>금액</th><th>메모</th></tr>
        </thead>
        <tbody id="income-table-body">
          <!-- rendered by js/income.js -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sheets-config.js"></script>
<script src="js/sheets-api.js"></script>
<script src="js/categories.js"></script>
<script src="js/income.js"></script>
</body>
</html>
